<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily briefing</title>
<style>
  body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; line-height: 1.5; }
  @media (prefers-color-scheme: dark) { body { background: #121212; color: #e8e8e8; } a { color: #60a5fa; } }
</style>
</head>
<body>
<h1>Daily briefing</h1>
<ul id="list"><li>Loading…</li></ul>
<script>
fetch('index.json').then(r => r.json()).then(items => {
  document.getElementById('list').innerHTML =
    items.map(i => `<li><a href="${i.url}">${i.title}</a></li>`).join('');
});
</script>
</body>
</html>
